name: Conflict Report

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:      # Allow manual trigger from the Actions tab

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install Python versions and create venvs
        run: |
          for py in 3.10 3.11 3.12 3.13 3.14; do
            uv python install $py
            uv venv --python $py .venvs/py${py} || echo "Skipping Python $py"
          done

      - name: Generate conflict report
        run: python report_conflicts.py docs/conflicts.md

      - name: Configure Git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit report
        run: |
          git add docs/conflicts.md
          git diff --staged --quiet || git commit -m "Update conflict report [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
